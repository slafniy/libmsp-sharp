name: Publish NuGet package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version"
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
      contents: write
    
    steps:
      # Build
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.107

      - name: Build package
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          dotnet pack LibMSPSharp/LibMSPSharp.csproj \
            -c Release \
            -o artifacts \
            /p:PackageVersion=$VERSION
      
      # Attach nuget package to GitHub Release
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/slafniy.LibMSPSharp.*.nupkg
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: slafniy

      # Push the package to nuget.org
      - name: NuGet push
        run: |
          dotnet nuget push artifacts/slafniy.LibMSPSharp.*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate